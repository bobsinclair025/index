<!DOCTYPE html>
<html>
<head>
    <title>Tuscarora Trail Progress</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { height: 600px; width: 100%; border-radius: 8px; }
        .stats-box { font-family: sans-serif; padding: 20px; background: #f8fafc; }
        /* Using Blue for the Tuscarora theme */
        .blue-text { color: #2563eb; font-weight: bold; }
    </style>
</head>
<body>

    <div class="stats-box">
        <h2>Tuscarora Trail Progress</h2>
        <p>Total Miles Hiked: <span id="totalMiles" class="blue-text">0</span> / 252.3</p>
    </div>
    
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map').setView([39.5, -78.1], 8);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        // --- TUSCARORA SKELETON (The Blue Line Path) ---
        const allTrail = [
            {m: 0.0, c: [38.8028, -78.2831]},   // Southern Terminus (SNP)
            {m: 10.2, c: [38.9312, -78.3283]},  // Elizabeth Furnace
            {m: 28.1, c: [39.0681, -78.5042]},  // Gerhard Shelter
            {m: 45.5, c: [39.1124, -78.5833]},  // Waites Run Rd
            {m: 86.4, c: [39.2631, -78.1884]},  // Basore Ridge Shelter
            {m: 106.1, c: [39.5168, -78.0165]}, // Sleepy Creek Lake
            {m: 125.0, c: [39.6978, -78.1755]}, // Hancock, MD
            {m: 133.5, c: [39.6842, -77.9421]}, // Fairview Mountain
            {m: 142.2, c: [39.7214, -77.9622]}, // PA/MD State Line
            {m: 155.1, c: [39.9961, -77.9248]}, // Cowans Gap
            {m: 174.4, c: [39.8943, -77.9621]}, // Tuscarora Summit (US-30)
            {m: 204.2, c: [40.2458, -77.5842]}, // Hemlocks Natural Area
            {m: 235.8, c: [40.3211, -77.2152]}, // Charlie Irvin Shelter
            {m: 252.3, c: [40.4022, -76.9951]}  // Northern Terminus
        ];

        // --- YOUR TUSCARORA HIKE LOG ---
        const rawHikes = `
VA	SNP	0.0	10.2	Elizabeth Furnace	5/10/26	N
        `;

        function processHikes() {
            let total = 0;
            const lines = rawHikes.trim().split('\n');
            
            lines.forEach(line => {
                const cols = line.split('\t');
                if (cols.length < 4) return;

                const s = parseFloat(cols[2]);
                const n = parseFloat(cols[3]);
                
                if (!isNaN(s) && !isNaN(n)) {
                    total += Math.abs(n - s);

                    // NEAREST NEIGHBOR LOGIC
                    const before = [...allTrail].reverse().find(a => a.m <= Math.min(s, n));
                    const after = allTrail.find(a => a.m >= Math.max(s, n));
                    const middle = allTrail.filter(a => a.m > Math.min(s, n) && a.m < Math.max(s, n));

                    const seg = [before, ...middle, after]
                        .filter(pt => pt !== undefined)
                        .sort((a, b) => a.m - b.m)
                        .map(a => a.c);

                    if (seg.length > 1) {
                        // Using Blue color for Tuscarora
                        L.polyline(seg, { color: '#2563eb', weight: 6, opacity: 0.8 }).addTo(map);
                    }
                }
            });
            document.getElementById('totalMiles').innerText = total.toFixed(1);
        }

        // Draw the full red "planned" trail first
        L.polyline(allTrail.map(a => a.c), { color: '#FF0000', weight: 4, dashArray: '5, 10' }).addTo(map);
        
        processHikes();
    </script>
</body>
</html>
